<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modzarella</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js" defer></script>
</head>
<body>
<header>
  <strong>Modzarella</strong>
  <span class="where" id="game">Looking for Cheese Rolling…</span>
  <button id="updateAll" data-act="update" hidden>Update all</button>
  <button class="primary" data-act="launch">Play</button>
</header>
<nav role="tablist">
  <button role="tab" id="tabMods" aria-selected="true" data-tab="mods">Mods</button>
  <button role="tab" id="tabSettings" aria-selected="false" data-tab="settings">Settings</button>
  <input type="search" id="search" placeholder="Search" aria-label="Search mods">
</nav>
<main>
  <p class="notice" id="error" hidden></p>
  <div id="mods"></div>
  <div class="settings" id="settings" hidden>
    <div class="field">
      <label for="gamedir">Game folder. Leave empty to find it automatically.</label>
      <div class="row"><input type="text" id="gamedir" placeholder="…/steamapps/common/Cheese Rolling"><button data-act="game" data-from="gamedir">Save</button></div>
    </div>
    <div class="field">
      <label for="source">Mod source: a URL, or a folder with an index.json.</label>
      <div class="row"><input type="text" id="source"><button data-act="source" data-from="source">Save</button></div>
    </div>
    <div class="field">
      <label>Open</label>
      <div class="row">
        <button data-act="open" data-value="game">Game folder</button>
        <button data-act="open" data-value="mods">Mods folder</button>
        <button data-act="open" data-value="log">Game log</button>
      </div>
    </div>
    <div class="field">
      <label>Repair and reset</label>
      <div class="row">
        <button id="loader" data-act="loader"></button>
        <button class="danger" data-act="reset" data-confirm="Click again to reset every mod setting">Reset mod settings</button>
        <button class="danger" data-act="unloader" data-confirm="Click again to remove everything">Remove all mods</button>
      </div>
    </div>
  </div>
</main>
<footer id="log">Ready.</footer>
</body>
</html>
