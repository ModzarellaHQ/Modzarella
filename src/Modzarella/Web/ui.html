<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modzarella</title>
<style>
  @font-face { font-family: "Archivo"; src: url(/fonts/archivo.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Plex Mono"; src: url(/fonts/plexmono-400.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Plex Mono"; src: url(/fonts/plexmono-600.woff2) format("woff2"); font-weight: 600; }

  :root {
    --wood: #201b16; --panel: #2b241d; --panel-low: #241e18; --inset: #120e0b; --edge: #0d0a08;
    --label: #f0e6d2; --dim: #a39581; --wax: #c8202f; --wax-light: #d8323f; --wax-dark: #8f1420;
    --brass: #d9a441; --brass-light: #e8c56e; --bad: #e0533f;
    --sans: "Archivo", "Helvetica Neue", "Segoe UI", sans-serif;
    --mono: "Plex Mono", Menlo, Consolas, monospace;
    --lit: inset 0 1px 0 rgba(255, 255, 255, .07);
    color-scheme: dark;
  }
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  html, body { height: 100% }
  body { margin: 0; background: var(--wood); color: var(--label); font: 14px/1.45 var(--sans); user-select: none; -webkit-user-select: none; display: flex; flex-direction: column }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: linear-gradient(#2e2720, #241e18); border-bottom: 1px solid var(--edge); box-shadow: 0 1px 0 rgba(255,255,255,.04) }
  .brand { font: 900 22px/1 var(--sans); letter-spacing: -0.01em }
  .brand b { color: var(--wax); font-weight: 900 }
  .where { flex: 1; min-width: 0; font: 11px/1.4 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

  button { font: 700 13px/1 var(--sans); color: var(--label); cursor: pointer; border: 1px solid var(--edge); border-radius: 7px; padding: 9px 14px;
           background: linear-gradient(#382f26, var(--panel)); box-shadow: var(--lit), 0 2px 0 var(--edge) }
  button:hover { background: linear-gradient(#43392e, #332a21) }
  button:active { transform: translateY(1px); box-shadow: var(--lit), 0 1px 0 var(--edge) }
  button:disabled { opacity: .45; cursor: default; transform: none }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px }
  .play { font: 800 15px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: #fff; padding: 11px 22px; border-color: var(--wax-dark);
          background: linear-gradient(var(--wax-light), var(--wax)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--edge) }
  .play:hover { background: linear-gradient(#e5404c, var(--wax-light)) }
  .ghost { background: none; border-color: transparent; box-shadow: none; color: var(--dim); font: 11px/1 var(--mono); padding: 4px 0 }
  .ghost:hover { background: none; color: var(--label) }

  main { flex: 1; overflow: auto; padding: 18px 20px 24px }
  .notice { font: 12px/1.5 var(--mono); color: var(--bad); margin: 0 0 12px }
  .section { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin: 6px 0 10px; display: flex; gap: 10px; align-items: center }
  .section::after { content: ""; flex: 1; height: 1px; background: var(--edge); box-shadow: 0 1px 0 rgba(255,255,255,.04) }

  .mods { display: grid; gap: 8px }
  .mod { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--edge); border-radius: 9px;
         background: linear-gradient(var(--panel), var(--panel-low)); box-shadow: var(--lit) }
  .mod h3 { margin: 0; font: 700 16px/1.2 var(--sans) }
  .meta { font: 11px/1.5 var(--mono); color: var(--dim); margin-top: 2px }
  .meta .update { color: var(--brass) }
  .mod p { margin: 6px 0 0; opacity: .82; max-width: 62ch }
  .mod .row { display: flex; gap: 14px; align-items: center; margin-top: 6px }
  details { font: 11px/1.5 var(--mono); color: var(--dim) }
  summary { cursor: pointer }
  summary:hover { color: var(--label) }

  .switch { position: relative; width: 46px; height: 24px; flex: none }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer }
  .switch span { position: absolute; inset: 0; border-radius: 99px; border: 1px solid var(--edge); background: linear-gradient(#0b0907, #1a1511); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); transition: background .15s; pointer-events: none }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(#fff, #cfc6b8); box-shadow: 0 1px 2px rgba(0,0,0,.6); transition: left .15s }
  .switch input:checked + span { background: linear-gradient(var(--brass-light), var(--brass)) }
  .switch input:checked + span::after { left: 24px }
  .switch input:disabled + span { opacity: .45 }
  .switch input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px }
  @media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none } }

  .settings { margin-top: 22px }
  .field { display: grid; gap: 6px; margin-bottom: 12px }
  .field label { font: 11px/1 var(--mono); color: var(--dim) }
  .field .row { display: flex; gap: 8px }
  input[type=text] { flex: 1; min-width: 0; background: linear-gradient(#0b0907, var(--inset)); color: var(--label); border: 1px solid var(--edge); border-radius: 6px; padding: 9px 10px; font: 12px/1.2 var(--mono); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); user-select: text }
  .danger:hover { color: var(--bad) }

  footer { font: 11px/1.5 var(--mono); color: var(--dim); padding: 8px 20px; background: var(--inset); border-top: 1px solid var(--edge); white-space: pre-wrap; max-height: 84px; overflow: auto }
  footer.busy::before { content: "● "; color: var(--brass) }
</style>
</head>
<body>
<header>
  <div class="brand">Modz<b>arella</b></div>
  <div class="where" id="game">looking for cheese rolling…</div>
  <button id="updateAll" onclick="act('update')" hidden>Update all</button>
  <button class="play" onclick="act('launch')">Play</button>
</header>
<main>
  <p class="notice" id="error" hidden></p>
  <div class="section">Mods</div>
  <div class="mods" id="mods"></div>

  <details class="settings" id="settings">
    <summary class="section">Settings</summary>
    <div class="field">
      <label for="gamedir">Game folder (empty finds it automatically)</label>
      <div class="row"><input type="text" id="gamedir" placeholder="…/steamapps/common/Cheese Rolling"><button onclick="act('game', null, $('gamedir').value)">Save</button></div>
    </div>
    <div class="field">
      <label for="source">Mod source (URL or folder with an index.json)</label>
      <div class="row"><input type="text" id="source"><button onclick="act('source', null, $('source').value)">Save</button></div>
    </div>
    <div class="field"><div class="row">
      <button id="loader" onclick="act('loader')"></button>
      <button id="removeAll" class="danger" onclick="removeAll(this)">Remove all mods</button>
    </div></div>
  </details>
</main>
<footer id="log">Ready.</footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const doing = { install: 'Installing', enable: 'Turning on', disable: 'Turning off', remove: 'Uninstalling', update: 'Updating', launch: 'Starting the game', loader: 'Installing the mod loader', unloader: 'Removing everything' };
let busy = false;

async function load() {
  const s = await (await fetch('/api/state')).json();
  if (document.activeElement !== $('source')) $('source').value = s.source;
  if (document.activeElement !== $('gamedir')) $('gamedir').value = s.gameDir || '';
  const problem = s.error || (s.game ? '' : "Cheese Rolling wasn't found. Set the game folder in Settings.");
  $('error').textContent = problem;
  $('error').hidden = !problem;
  if (!s.game) $('settings').open = true;
  $('game').textContent = s.game ? s.game.dir : 'cheese rolling not found';
  $('loader').textContent = s.game?.loader ? 'Repair mod loader' : 'Install mod loader';
  $('updateAll').hidden = !s.mods.some(m => m.state === 'UpdateAvailable');
  $('mods').innerHTML = s.mods.map(({ mod, state }) => {
    const on = state === 'Enabled' || state === 'UpdateAvailable';
    const installed = state !== 'NotInstalled';
    const id = esc(mod.id);
    return `<article class="mod">
      <div>
        <h3>${esc(mod.name)}</h3>
        <div class="meta">v${esc(mod.version)} · ${esc(mod.author)}${state === 'UpdateAvailable' ? ' · <span class="update">update ready</span>' : ''}</div>
        <p>${esc(mod.description)}</p>
        <div class="row">
          ${installed ? `<button class="ghost" onclick="act('remove','${id}')">uninstall</button>` : ''}
          ${mod.credits?.length ? `<details><summary>credits</summary>${mod.credits.map(esc).join('<br>')}</details>` : ''}
        </div>
      </div>
      <label class="switch" title="${on ? 'On' : 'Off'}"><input type="checkbox" aria-label="${esc(mod.name)}" ${on ? 'checked' : ''}
        onchange="act(this.checked ? '${installed ? 'enable' : 'install'}' : 'disable', '${id}')"><span></span></label>
    </article>`;
  }).join('');
}

function removeAll(button) {
  if (button.dataset.armed) { delete button.dataset.armed; act('unloader'); return; }
  button.dataset.armed = '1';
  button.textContent = 'Click again to remove everything';
  setTimeout(() => { delete button.dataset.armed; button.textContent = 'Remove all mods'; }, 4000);
}

async function act(action, id, value) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button, input').forEach(b => b.disabled = true);
  $('log').classList.add('busy');
  $('log').textContent = `${doing[action] ?? 'Saving'}${id ? ' ' + id : ''}…`;
  try {
    const r = await (await fetch('/api/do', { method: 'POST', body: JSON.stringify({ action, id, value }) })).json();
    $('log').textContent = r.error ? 'Error: ' + r.error : r.log.join('\n');
  } catch (e) { $('log').textContent = 'Error: ' + e; }
  $('log').classList.remove('busy');
  busy = false;
  document.querySelectorAll('button, input').forEach(b => b.disabled = false);
  await load();
}

load();
</script>
</body>
</html>
