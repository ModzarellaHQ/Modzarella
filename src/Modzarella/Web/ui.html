<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modzarella</title>
<style>
  :root { --bg:#16161a; --card:#202026; --line:#2e2e36; --text:#ececf0; --dim:#9a9aa6; --accent:#f5b830; --ok:#5fd17a; --warn:#f0a040; --bad:#f06a5a; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); user-select:none; -webkit-user-select:none; }
  header { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:16px; padding:18px 24px; background:var(--bg); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; color:var(--accent); }
  .grow { flex:1; min-width:0; }
  .dim { color:var(--dim); }
  .small { font-size:12px; }
  .ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { max-width:860px; margin:0 auto; padding:20px 24px 80px; }
  input { width:100%; background:#0f0f12; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; user-select:text; }
  button { background:#2c2c34; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1a1300; border-color:var(--accent); font-weight:700; }
  button.play { font-size:16px; padding:10px 28px; }
  button.link { background:none; border:none; padding:0; color:var(--dim); font-size:12px; text-decoration:underline; }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .mod { display:flex; gap:16px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .mod h3 { margin:0 0 2px; font-size:16px; }
  .mod p { margin:4px 0 0; }
  .update { color:var(--warn); }
  details { margin-top:6px; font-size:12px; color:var(--dim); }
  summary { cursor:pointer; }
  .switch { position:relative; width:46px; height:26px; flex:none; margin-top:2px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; border-radius:999px; background:#3a3a44; cursor:pointer; transition:.15s; }
  .switch span::before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.15s; }
  .switch input:checked + span { background:var(--ok); }
  .switch input:checked + span::before { transform:translateX(20px); }
  .switch input:disabled + span { opacity:.5; cursor:default; }
  .settings { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; color:var(--text); font-size:14px; }
  .settings summary { color:var(--dim); }
  .field { margin-top:12px; }
  .field label { display:block; margin-bottom:4px; color:var(--dim); font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .error { color:var(--bad); margin-bottom:12px; }
  footer { position:fixed; bottom:0; left:0; right:0; padding:8px 24px; background:#0f0f12; border-top:1px solid var(--line); font:12px ui-monospace,monospace; color:var(--dim); white-space:pre-wrap; max-height:96px; overflow:auto; }
</style>
</head>
<body>
<header>
  <div class="grow">
    <h1>Modzarella</h1>
    <div class="dim small ellipsis" id="game">Looking for Cheese Rolling…</div>
  </div>
  <button id="updateAll" onclick="act('update')" hidden>Update all</button>
  <button class="primary play" onclick="act('launch')">Play</button>
</header>
<main>
  <div class="error" id="error"></div>
  <div id="mods"></div>
  <details class="settings" id="settings">
    <summary>Settings</summary>
    <div class="field">
      <label>Game folder (leave empty to find it automatically)</label>
      <div class="row"><input id="gamedir" class="grow" placeholder="…/steamapps/common/Cheese Rolling"><button onclick="act('game', null, $('gamedir').value)">Save</button></div>
    </div>
    <div class="field">
      <label>Mod source (URL or folder with an index.json)</label>
      <div class="row"><input id="source" class="grow"><button onclick="act('source', null, $('source').value)">Save</button></div>
    </div>
    <div class="field row">
      <button id="loader" onclick="act('loader')"></button>
      <button class="danger" onclick="confirm('Remove the mod loader and every mod?') && act('unloader')">Remove all mods</button>
    </div>
  </details>
</main>
<footer id="log">Ready.</footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busy = false;

async function load() {
  const s = await (await fetch('/api/state')).json();
  if (document.activeElement !== $('source')) $('source').value = s.source;
  if (document.activeElement !== $('gamedir')) $('gamedir').value = s.gameDir || '';
  $('error').textContent = s.error || (s.game ? '' : 'Cheese Rolling wasn\'t found. Set the game folder in Settings.');
  if (!s.game) $('settings').open = true;
  $('game').textContent = s.game ? `Cheese Rolling · ${s.game.dir}` : 'Cheese Rolling not found';
  $('loader').textContent = s.game?.loader ? 'Repair mod loader' : 'Install mod loader';
  $('updateAll').hidden = !s.mods.some(m => m.state === 'UpdateAvailable');
  $('mods').innerHTML = s.mods.map(({mod, state}) => {
    const on = state === 'Enabled' || state === 'UpdateAvailable';
    const installed = state !== 'NotInstalled';
    return `
    <div class="mod">
      <div class="grow">
        <h3>${esc(mod.name)} <span class="dim small">v${esc(mod.version)}</span></h3>
        <div class="dim small">${esc(mod.author)}${state === 'UpdateAvailable' ? ' · <span class="update">update available</span>' : ''}</div>
        <p>${esc(mod.description)}</p>
        ${mod.credits?.length ? `<details><summary>Credits</summary>${mod.credits.map(esc).join('<br>')}</details>` : ''}
        ${installed ? `<div style="margin-top:6px"><button class="link" onclick="act('remove','${esc(mod.id)}')">Uninstall</button></div>` : ''}
      </div>
      <label class="switch" title="${on ? 'On' : 'Off'}"><input type="checkbox" ${on ? 'checked' : ''}
        onchange="act(this.checked ? '${installed ? 'enable' : 'install'}' : 'disable', '${esc(mod.id)}')"><span></span></label>
    </div>`;
  }).join('');
}

async function act(action, id, value) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button, input').forEach(b => b.disabled = true);
  $('log').textContent = { install:'Installing', enable:'Turning on', disable:'Turning off', remove:'Uninstalling', update:'Updating', launch:'Starting the game', loader:'Installing the mod loader', unloader:'Removing everything' }[action] ?? 'Saving';
  $('log').textContent += id ? ` ${id}…` : '…';
  try {
    const r = await (await fetch('/api/do', { method:'POST', body: JSON.stringify({ action, id, value }) })).json();
    $('log').textContent = r.error ? 'Error: ' + r.error : r.log.join('\n');
  } catch (e) { $('log').textContent = 'Error: ' + e; }
  busy = false;
  document.querySelectorAll('button, input').forEach(b => b.disabled = false);
  await load();
}

load();
</script>
</body>
</html>
