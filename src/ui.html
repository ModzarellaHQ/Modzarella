<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheeseMM</title>
<style>
  :root { --bg:#16161a; --card:#202026; --line:#2e2e36; --text:#ececf0; --dim:#9a9aa6; --accent:#f5b830; --ok:#5fd17a; --warn:#f0a040; --bad:#f06a5a; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; color:var(--accent); }
  .grow { flex:1; }
  .dim { color:var(--dim); }
  main { max-width:1000px; margin:0 auto; padding:20px 24px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  input { flex:1; min-width:220px; background:#0f0f12; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
  button { background:#2c2c34; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1a1300; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; font-size:16px; }
  .row { display:flex; gap:8px; align-items:center; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .Enabled { color:var(--ok); border-color:var(--ok); }
  .Disabled { color:var(--dim); }
  .UpdateAvailable { color:var(--warn); border-color:var(--warn); }
  details { font-size:12px; color:var(--dim); }
  #log { margin-top:20px; background:#0f0f12; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:12px ui-monospace,monospace; color:var(--dim); white-space:pre-wrap; max-height:180px; overflow:auto; }
  .error { color:var(--bad); margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>CheeseMM</h1>
  <div class="grow dim" id="game">Looking for Cheese Rolling…</div>
  <button id="loader"></button>
  <button onclick="act('update')">Update all</button>
  <button class="primary" onclick="act('launch')">Play modded</button>
</header>
<main>
  <div class="bar">
    <span class="dim">Mod source</span>
    <input id="source" placeholder="URL or folder of a CheeseMods repo">
    <button onclick="act('source', null, $('source').value)">Save</button>
  </div>
  <div class="bar" id="gamebar" hidden>
    <span class="dim">Game folder</span>
    <input id="gamedir" placeholder="…/steamapps/common/Cheese Rolling">
    <button onclick="act('game', null, $('gamedir').value)">Save</button>
  </div>
  <div class="error" id="error"></div>
  <div class="grid" id="mods"></div>
  <div id="log">Ready.</div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = { NotInstalled:'Not installed', Enabled:'Enabled', Disabled:'Disabled', UpdateAvailable:'Update available' };
let busy = false;

async function load() {
  const s = await (await fetch('/api/state')).json();
  if (document.activeElement !== $('source')) $('source').value = s.source;
  $('error').textContent = s.error || '';
  $('gamebar').hidden = !!s.game;
  $('game').textContent = s.game ? `${s.game.dir} · ${s.game.platform}` : 'Cheese Rolling not found — set the game folder below.';
  $('loader').textContent = s.game?.loader ? 'Reinstall loader' : 'Install loader';
  $('loader').onclick = () => act('loader');
  $('mods').innerHTML = s.mods.map(({mod, state}) => `
    <div class="card">
      <div class="row"><h3 class="grow">${esc(mod.name)}</h3><span class="badge ${state}">${label[state]}</span></div>
      <div class="dim">v${esc(mod.version)} · ${esc(mod.author)}${mod.dependencies.length ? ' · needs ' + mod.dependencies.map(esc).join(', ') : ''}</div>
      <div>${esc(mod.description)}</div>
      ${mod.credits?.length ? `<details><summary>Credits</summary>${mod.credits.map(esc).join('<br>')}</details>` : ''}
      <div class="row">${buttons(mod.id, state)}</div>
    </div>`).join('');
}

function buttons(id, state) {
  const b = (text, action, primary) => `<button ${primary ? 'class="primary"' : ''} onclick="act('${action}','${id}')">${text}</button>`;
  if (state === 'NotInstalled') return b('Install', 'install', true);
  if (id === 'core') return state === 'UpdateAvailable' ? b('Update', 'update', true) : '<span class="dim">Required by every mod</span>';
  return [
    state === 'UpdateAvailable' ? b('Update', 'update', true) : '',
    state === 'Disabled' ? b('Enable', 'enable') : b('Disable', 'disable'),
    b('Remove', 'remove'),
  ].join('');
}

async function act(action, id, value) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  $('log').textContent = `${action}${id ? ' ' + id : ''}…`;
  try {
    const r = await (await fetch('/api/do', { method:'POST', body: JSON.stringify({ action, id, value }) })).json();
    $('log').textContent = r.error ? 'Error: ' + r.error : r.log.join('\n');
  } catch (e) { $('log').textContent = 'Error: ' + e; }
  busy = false;
  await load();
}

load();
</script>
</body>
</html>
